services:
  - type: web
    name: lookahead
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      # Set in the Render dashboard (never commit it). Without it the app runs on its deterministic engine.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LOOKAHEAD_SESSION_CAP
        value: "15"
      - key: LOOKAHEAD_DAILY_CAP
        value: "300"
